version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: borderguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - STREAM_FPS=15
      - CPU_NUM_THREADS=4
      - CONFIDENCE_THRESHOLD=0.45
    volumes:
      - ./backend/assets:/app/assets
      - ./backend/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: borderguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

networks:
  default:
    name: borderguard-network
